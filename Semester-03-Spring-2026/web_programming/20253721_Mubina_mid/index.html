<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Mubina Yigitalieva" />
    <meta
      name="description"
      content="Events Page of Springfield Community Library"
    />

    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header>
      <figure>
        <img
          src="./images/library-logo.jpg"
          alt="Springfield Library Image"
          width="200"
          height="200"
        />
      </figure>

      <h1>Springfield Community Library</h1>

      <nav>
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./events.html">Event Schedule</a></li>
          <li><a href="http://www.kla.kr">ALA Website</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Our Mission</h2>
        <p>
          To empower the community trough <strong>free</strong> access to
          knowledge
        </p>
      </section>

      <section>
        <h2>Library Card Application</h2>
        <form method="post">
          <fieldset>
            <legend>New Member Application</legend>
            <p>
              <label for="firstname">Firstname: </label>
              <input type="text" id="firstname" placeholder="John" />
            </p>
            <p>
              <label for="phone">Phone Number: </label>
              <input
                type="tel"
                name="phone"
                id="phone"
                placeholder="123-5656"
              />
            </p>
            <label for="agegroup">Age Group: </label>
            <select name="agegroup" id="agegroup">
              <option value="under18">under 18</option>
              <option value="18-64">18-64</option>
              <option value="65+">65+</option>
            </select>
          </fieldset>

          <br />

          <button type="submit">Apply Now</button>
        </form>
      </section>
    </main>

    <footer>
      <p>
        &copy; 2026 Copyright Springfield Library |
        <a href="tel:555-0123">555-0123</a>
      </p>
    </footer>
  </body>
</html>
